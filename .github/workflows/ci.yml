# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  pull_request:
    paths-ignore:
    - 'README.md'
    - '.pre-commit-config.yaml'
    - 'docs/**'
  push:
    paths-ignore:
    - 'README.md'
    - '.pre-commit-config.yaml'
    - 'docs/**'
    branches:
    - main
    tags:
    - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: "!startsWith(github.event.head_commit.message, '(skip-ci)')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.15', '3.15t']
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: ${{ matrix.os }} - ${{ matrix.python-version }}
    steps:
    - name: Set git to not change line endings
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0   # fetch full history
        fetch-tags: true # ensure tags are available
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        working-directory: .
        version: "0.13.4"
        python-version: ${{ matrix.python-version }}
        enable-cache: false
    - name: Install tox and tox-uv
      run: uv tool install tox --with tox-uv
    - name: Run tox
      # Run tox using the version of Python in `PATH`
      run: tox --list-dependencies -e py -- -vv

  dist:
    runs-on: ubuntu-latest
    needs: [test]
    name: Build Python packages
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0   # fetch full history
        fetch-tags: true # ensure tags are available
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        working-directory: .
        version: "0.13.4"
        enable-cache: false
    - name: Build package
      run: uv build --sdist --wheel -o dist/
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist
        path: dist

  dist_upload:
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    needs: [dist]
    name: PyPI upload
    permissions:
      id-token: write  # needed for trusted publishing to PyPI
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist
    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1  # zizmor: ignore[unpinned-uses]

  github_release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    needs: [dist_upload]
    name: Publish GitHub release
    permissions:
      contents: write  # required to create a release and upload assets
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0   # fetch full history
        fetch-tags: true # ensure tags are available
        persist-credentials: false
    - name: Prepare release name
      run: echo "RELEASE_NAME=${GITHUB_REF_NAME#v}" >> "${GITHUB_ENV}"
    - name: Create GitHub release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        gh release create "${GITHUB_REF_NAME}" \
          --title "${RELEASE_NAME}" \
          --generate-notes \
          --verify-tag \
          --latest
