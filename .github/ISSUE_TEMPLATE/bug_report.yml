name: Bug report
description: Report something that isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal code sample or steps that reproduce the problem.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Edison version
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: CPython 3.14, macOS 15
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Traceback / logs
      render: text
