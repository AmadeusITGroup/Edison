repos:
  - repo: "meta"
    hooks:
      - id: "check-hooks-apply"
      - id: "check-useless-excludes"

  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # frozen: v6.0.0
    hooks:
      - id: "check-added-large-files"
      - id: "check-merge-conflict"
      - id: "check-yaml"

  - repo: "https://github.com/astral-sh/ruff-pre-commit"
    rev: "38bfb07c0c64c304f47eb52090f8288150c77730"  # frozen: v0.17.1
    hooks:
      - id: "ruff-check"
        args: ["--fix"]

  - repo: "https://github.com/psf/black-pre-commit-mirror"
    rev: "a5439e9af2ff9371297bb1a76a01b8ad17989b88"  # frozen: 26.10.1
    hooks:
      - id: "black"

  - repo: "https://github.com/astral-sh/uv-pre-commit"
    rev: "dd409d04a3fa4a50f918dddb3ad3c6d8f46ab2cd"  # frozen: 0.13.4
    hooks:
      - id: "uv-audit"
        args: ["--system-certs", "--preview-features", "audit"]

  - repo: "https://github.com/astral-sh/ty-pre-commit"
    rev: "413d39a1ae22e511c7d094682a0caf1486a49a36"  # frozen: v0.0.90
    hooks:
      - id: "ty"
        args: ["--system-certs", "--group", "test", "--group", "typing"]

  - repo: "https://github.com/zizmorcore/zizmor-pre-commit"
    rev: "c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f"  # frozen: v1.31.1
    hooks:
      - id: "zizmor"
        args: ["--pedantic", "--no-progress"]
